<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .terminal-bg { fill: #000000; }
      .terminal-border { fill: #333333; stroke: #666666; stroke-width: 2; }
      .cursor { fill: #00ff41; }
      .text { fill: #00ff41; font-family: monospace; font-size: 8px; }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect x="10" y="15" width="80" height="70" rx="5" class="terminal-bg"/>
  <rect x="10" y="15" width="80" height="70" rx="5" fill="none" class="terminal-border"/>

  <!-- Title bar -->
  <rect x="10" y="15" width="80" height="15" rx="5" fill="#1a1a1a"/>
  <circle cx="20" cy="22.5" r="3" fill="#ff5f57"/>
  <circle cx="32" cy="22.5" r="3" fill="#ffbd2e"/>
  <circle cx="44" cy="22.5" r="3" fill="#28ca42"/>

  <!-- Terminal content -->
  <text x="20" y="45" class="text">bald-net</text>
  <rect x="20" y="50" width="8" height="2" class="cursor"/>
  <text x="20" y="65" class="text" font-size="6">v1.0</text>
</svg>